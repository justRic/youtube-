<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>YouTube</title>
<style>
/*=========================== tokens ===========================*/
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Roboto,"Segoe UI",Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;overflow-y:scroll;scrollbar-gutter:stable}
:root{
--bg:#0f0f0f;--text:#f1f1f1;--text-2:#aaaaaa;--border:#303030;
--chip:#272727;--chip-hover:#3f3f3f;--hover:#272727;
--search-bg:#121212;--btn:#222222;--btn-hover:#303030;
--desc:#272727;--menu:#282828;--sk:#1f1f1f;--sk2:#2b2b2b;
--focus:#3ea6ff;--shadow:0 16px 40px rgba(0,0,0,.6);
}
[data-theme=light]{
--bg:#ffffff;--text:#0f0f0f;--text-2:#606060;--border:#d3d3d3;
--chip:#f2f2f2;--chip-hover:#e5e5e5;--hover:#f2f2f2;
--search-bg:#ffffff;--btn:#f8f8f8;--btn-hover:#f0f0f0;
--desc:#f2f2f2;--menu:#ffffff;--sk:#e9e9e9;--sk2:#f4f4f4;
--focus:#065fd4;--shadow:0 16px 40px rgba(0,0,0,.18);
}
svg{display:block;flex:none}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:none}
input{font-family:inherit}
img{max-width:100%}
::selection{background:#3ea6ff55}
/*=========================== header ===========================*/
.masthead{position:fixed;inset:0 0 auto 0;height:56px;z-index:80;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bg)}
.mh-left{display:flex;align-items:center;gap:4px;flex:none}
.mh-center{display:flex;align-items:center;gap:8px;flex:1 1 auto;justify-content:center;min-width:0;padding:0 8px}
.mh-right{display:flex;align-items:center;gap:8px;flex:none;justify-content:flex-end}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.icon-btn:hover{background:var(--hover)}
.icon-btn.sm{width:36px;height:36px}
.logo{display:flex;align-items:center;gap:3px;text-decoration:none;padding:0 6px 0 4px;position:relative}
.logo-mark{width:30px;height:21px}
.logo-word{font-size:20px;font-weight:600;letter-spacing:-1.1px;line-height:20px}
.logo-cc{position:absolute;top:-3px;right:0;font-size:9px;line-height:9px;letter-spacing:0;color:var(--text-2)}
.search-form{display:flex;align-items:center;gap:8px;width:100%;max-width:716px}
.search-field{display:flex;align-items:center;flex:1 1 auto;height:40px;background:var(--search-bg);border:1px solid var(--border);border-right:0;border-radius:20px 0 0 20px;padding:0 6px 0 14px;min-width:0}
.search-field:focus-within{border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.search-field svg{width:20px;height:20px;color:var(--text-2);margin-right:8px}
.search-field input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--text);font-size:16px;padding:0}
.search-field input::placeholder{color:var(--text-2)}
.search-btn{width:64px;height:40px;border:1px solid var(--border);border-radius:0 20px 20px 0;background:var(--btn);display:grid;place-items:center;flex:none}
.search-btn:hover{background:var(--btn-hover)}
.mic-btn{width:40px;height:40px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none}
.mic-btn:hover{background:var(--chip-hover)}
.pill-btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;background:var(--chip);font-weight:500;font-size:14px;white-space:nowrap}
.pill-btn:hover{background:var(--chip-hover)}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:#7d4bd1;color:#fff;font-weight:600;font-size:14px;display:grid;place-items:center;flex:none}
.bell{position:relative}
.bell::after{content:"";position:absolute;top:6px;right:8px;width:7px;height:7px;border-radius:50%;background:#f33;border:2px solid var(--bg)}
.icon-btn svg,.nav-item svg,.pill-btn svg,.action-pill svg,.pg-btn svg,.search-btn svg,.mic-btn svg,.search-field svg,.sub-btn svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/*=========================== sidebar ===========================*/
.sidebar{position:fixed;top:56px;bottom:0;left:0;width:240px;padding:12px 12px 24px;background:var(--bg);overflow-y:auto;overflow-x:hidden;z-index:70;scrollbar-width:thin;scrollbar-color:var(--chip) transparent}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:var(--chip);border-radius:4px}
.sidebar:hover::-webkit-scrollbar-thumb{background:var(--chip-hover)}
.nav-section{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;gap:24px;width:100%;height:40px;padding:0 12px;border-radius:10px;font-size:14px;text-align:left;white-space:nowrap;overflow:hidden;color:var(--text)}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--chip);font-weight:500}
.nav-item .label{overflow:hidden;text-overflow:ellipsis}
.nav-title{display:flex;align-items:center;gap:4px;padding:6px 12px 6px;font-size:15px;font-weight:500}
.nav-title svg{width:18px;height:18px}
.nav-avatar{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none;overflow:hidden}
.nav-avatar img{width:100%;height:100%;object-fit:cover}
.nav-divider{height:1px;background:var(--border);margin:12px 0}
.side-footer{padding:16px 12px 0;font-size:12px;line-height:18px;color:var(--text-2)}
.side-footer b{display:block;margin-top:16px;font-weight:400;color:#717171;font-size:11px}
/* mini rail */
body[data-nav=mini] .sidebar{width:72px;padding:4px 4px 16px}
body[data-nav=mini] .nav-item{flex-direction:column;gap:6px;height:74px;padding:0 2px;font-size:10px;line-height:14px;justify-content:center;text-align:center;white-space:normal}
body[data-nav=mini] .nav-item svg{width:24px;height:24px}
body[data-nav=mini] .mini-hide{display:none!important}
body[data-nav=hidden] .sidebar{display:none}
/*=========================== main / chips ===========================*/
.main{margin-left:240px;padding-top:56px;min-height:100vh}
body[data-nav=mini] .main{margin-left:72px}
body[data-nav=hidden] .main{margin-left:0}
@media (max-width:791px){.main{margin-left:0!important}}
.chips{position:sticky;top:56px;z-index:50;display:flex;gap:12px;padding:12px 24px;background:var(--bg);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 12px;border-radius:8px;background:var(--chip);font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip:hover{background:var(--chip-hover)}
.chip.active{background:var(--text);color:var(--bg)}
/*=========================== grid / cards ===========================*/
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px 16px;padding:8px 24px 48px;align-content:start}
@media (max-width:1100px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px 16px;padding:8px 16px 40px}}
@media (max-width:560px){.grid{grid-template-columns:1fr;gap:22px}}
.card{display:flex;flex-direction:column;gap:12px;min-width:0;cursor:pointer;border-radius:12px}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--sk)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .badges{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.dur{background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:500;line-height:12px;padding:3px 4px;border-radius:4px;letter-spacing:.2px}
.badge-live{background:#f33;color:#fff;font-size:11px;font-weight:600;padding:3px 5px;border-radius:4px;text-transform:uppercase}
.badge-cc{background:rgba(0,0,0,.8);color:#fff;font-size:11px;font-weight:600;padding:3px 4px;border-radius:4px}
.card-body{display:flex;gap:12px;align-items:flex-start}
.avatar{position:relative;width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:600;line-height:1}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-text{min-width:0}
.card-title{font-size:14px;line-height:20px;font-weight:500;margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:12px;line-height:18px;color:var(--text-2)}
.card-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.card:hover .card-title{color:var(--text)}
/* skeletons */
.sk-thumb,.sk-line,.sk-av{background:linear-gradient(90deg,var(--sk) 25%,var(--sk2) 37%,var(--sk) 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px}
.sk-av{border-radius:50%}
.sk-line{height:12px;margin-bottom:8px}
@keyframes sh{0%{background-position:100% 0}100%{background-position:0 0}}
/*=========================== watch page ===========================*/
.watch{display:flex;gap:24px;padding:24px 24px 48px;max-width:1754px;margin:0 auto;align-items:flex-start}
.watch-main{flex:1 1 auto;min-width:0}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0;display:block}
.player .poster{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.play-btn{position:absolute;inset:0;margin:auto;width:68px;height:48px;border-radius:12px;background:rgba(0,0,0,.65);display:grid;place-items:center}
.play-btn:hover{background:rgba(0,0,0,.85)}
.play-btn svg{width:26px;height:26px;color:#fff;fill:currentColor;stroke:none}
.watch-title{font-size:20px;line-height:28px;font-weight:700;margin:12px 0 4px}
.channel-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0}
.channel-left{display:flex;align-items:center;gap:12px;min-width:0}
.channel-name{font-size:16px;line-height:22px;font-weight:500}
.channel-subs{font-size:12px;color:var(--text-2)}
.sub-btn{height:36px;padding:0 16px;border-radius:18px;background:var(--text);color:var(--bg);font-size:14px;font-weight:500;flex:none}
.sub-btn:hover{opacity:.9}
.sub-btn.on{background:var(--chip);color:var(--text)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill-group{display:flex;align-items:center;height:36px;border-radius:18px;background:var(--chip);overflow:hidden}
.pg-btn{display:flex;align-items:center;gap:6px;height:36px;padding:0 16px;font-size:14px;font-weight:500;white-space:nowrap}
.pg-btn:hover{background:var(--chip-hover)}
.pg-btn.down{padding:0 14px}
.pg-btn svg{width:24px;height:24px}
.pg-sep{width:1px;height:24px;background:var(--border);flex:none}
.action-pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:18px;background:var(--chip);font-size:14px;font-weight:500;white-space:nowrap}
.action-pill:hover{background:var(--chip-hover)}
.action-pill svg{width:24px;height:24px}
.action-pill.icon-only{padding:0 10px}
.desc{background:var(--desc);border-radius:12px;padding:12px;margin-top:4px;font-size:14px;line-height:20px;cursor:pointer}
.desc-meta{font-weight:600;margin-bottom:4px}
.desc-text{margin:0;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc.open .desc-text{display:block}
.desc-toggle{font-weight:500;margin-top:2px}
.comments{margin-top:24px}
.comments-head{display:flex;align-items:center;gap:24px;font-size:20px;font-weight:700;margin-bottom:20px}
.sort-btn{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.sort-btn svg{width:22px;height:22px}
.comment-box{display:flex;gap:12px;align-items:flex-start}
.comment-form{flex:1;min-width:0}
.comment-input{width:100%;background:none;border:none;border-bottom:1px solid var(--border);outline:none;color:var(--text);font-size:14px;padding:6px 0 8px}
.comment-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.comment-actions[hidden]{display:none}
.text-btn{height:36px;padding:0 16px;border-radius:18px;font-weight:500;font-size:14px}
.text-btn:hover{background:var(--hover)}
.sub-btn.sm{height:36px;opacity:.55;cursor:default}
/*=========================== related rail ===========================*/
.watch-side{width:402px;flex:0 0 402px;display:flex;flex-direction:column;gap:10px}
.side-title{font-size:16px;font-weight:500;margin-bottom:2px}
.compact{display:flex;gap:8px;padding:4px;border-radius:10px;cursor:pointer}
.compact:hover{background:var(--hover)}
.compact .thumb{width:168px;flex:none;border-radius:8px}
.compact .card-text{padding-top:2px}
.compact .card-title{font-size:14px;line-height:20px;margin-bottom:4px}
.compact .card-meta{font-size:12px}
/*=========================== account menu ===========================*/
.menu{position:fixed;top:54px;right:16px;width:300px;background:var(--menu);border-radius:12px;box-shadow:var(--shadow);padding:8px 0;z-index:90;overflow:hidden}
.menu[hidden]{display:none}
.menu-head{display:flex;gap:12px;align-items:center;padding:12px 16px 16px}
.menu-head .avatar{width:40px;height:40px}
.menu-name{font-size:16px;font-weight:500}
.menu-mail{font-size:14px;color:var(--text-2)}
.menu-sep{height:1px;background:var(--border);margin:8px 0}
.menu-item{display:flex;align-items:center;gap:16px;width:100%;padding:10px 16px;font-size:14px;text-align:left}
.menu-item:hover{background:var(--hover)}
.menu-item svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.menu-status{margin-left:auto;font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#2ba640}
.dot.off{background:#f90}
/*=========================== toast / misc ===========================*/
.toast{position:fixed;left:24px;bottom:24px;z-index:120;background:#f1f1f1;color:#0f0f0f;font-size:14px;font-weight:500;padding:14px 18px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.4);opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .18s,transform .18s;max-width:min(420px,80vw)}
.toast.show{opacity:1;transform:none}
[data-theme=light] .toast{background:#0f0f0f;color:#f1f1f1}
.empty{padding:48px 24px;text-align:center;color:var(--text-2);font-size:14px}
.empty b{display:block;color:var(--text);font-size:18px;font-weight:500;margin-bottom:6px}
.scrim{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.watch{animation:fade .15s ease}
/*=========================== shorts ===========================*/
.shorts{position:relative;height:calc(100vh - 56px);overflow:hidden;animation:fade .15s ease}
.shorts-head{position:absolute;top:14px;left:24px;right:24px;z-index:4;display:flex;align-items:center;gap:12px;pointer-events:none}
.shorts-head h2{font-size:18px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px}
.shorts-head h2 svg{width:24px;height:24px}
.shorts-head .spacer{flex:1}
.shorts-back,.shorts-refresh{pointer-events:auto;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--chip);font-size:13px;font-weight:500}
.shorts-back:hover,.shorts-refresh:hover{background:var(--chip-hover)}
.shorts-back svg,.shorts-refresh svg{width:18px;height:18px}
.shorts-scroll{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior:contain}
.shorts-scroll::-webkit-scrollbar{display:none}
.short-item{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;gap:22px;padding:56px 76px 16px 24px}
.short-stage{position:relative;height:100%;aspect-ratio:9/16;max-width:min(100%,430px);border-radius:12px;overflow:hidden;background:#000;flex:none;cursor:pointer;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.short-stage iframe,.short-stage .poster{width:100%;height:100%;border:0;display:block;object-fit:cover}
.short-stage .poster{filter:brightness(.82)}
.short-play{position:absolute;inset:0;margin:auto;width:66px;height:66px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.short-play svg{width:30px;height:30px;color:#fff;fill:currentColor;stroke:none}
.short-info{width:310px;max-width:32vw;align-self:flex-end;padding-bottom:26px;display:flex;flex-direction:column;gap:16px}
.short-channel{display:flex;align-items:center;gap:10px;cursor:pointer;width:max-content;max-width:100%}
.short-channel:hover .short-channel-name{text-decoration:underline}
.short-channel .avatar{width:40px;height:40px}
.short-channel-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.short-sub-btn{height:32px;padding:0 14px;border-radius:16px;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;flex:none}
.short-sub-btn.on{background:var(--chip);color:var(--text)}
.short-title{font-size:14px;line-height:20px;margin:0}
.short-title .hash{color:var(--focus)}
.short-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.short-act{width:44px;height:44px;border-radius:50%;background:var(--chip);display:grid;place-items:center;flex:none}
.short-act:hover{background:var(--chip-hover)}
.short-act svg{width:22px;height:22px}
.short-act.liked{color:var(--focus)}
.short-act.liked svg{stroke:var(--focus)}
.short-nav{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:4;display:flex;flex-direction:column;gap:12px}
.short-nav button{width:44px;height:44px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
.short-nav button:hover:not(:disabled){background:var(--chip-hover)}
.short-nav button:disabled{opacity:.3;cursor:default}
.short-nav svg{width:24px;height:24px}
/*=========================== channel page ===========================*/
.channel-banner{height:170px;background:linear-gradient(115deg,#202020,#3a3a3a 45%,var(--bg));position:relative;overflow:hidden}
.channel-banner::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 30%,rgba(255,255,255,.09),transparent 45%)}
.channel-head{display:flex;gap:24px;align-items:flex-end;padding:0 24px 20px;max-width:1600px;margin:0 auto}
.channel-head .avatar{width:96px;height:96px;font-size:38px;border:4px solid var(--bg);margin-top:-48px;z-index:1}
.channel-info{flex:1;min-width:0;padding-bottom:2px}
.channel-name-lg{font-size:30px;line-height:36px;font-weight:700;margin:0 0 4px}
.channel-handle{font-size:14px;color:var(--text-2)}
.channel-stats{font-size:14px;color:var(--text-2);margin-top:6px}
.channel-desc{font-size:14px;line-height:20px;color:var(--text-2);margin-top:8px;max-width:680px;white-space:pre-wrap}
.channel-actions{display:flex;gap:8px;align-items:center;padding-bottom:4px}
.channel-tabs{display:flex;gap:24px;padding:0 24px;border-bottom:1px solid var(--border);max-width:1600px;margin:0 auto}
.channel-tab{height:48px;font-size:14px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent}
.channel-tab.active{color:var(--text);border-bottom-color:var(--text)}
/*=========================== playables ===========================*/
.playables{padding:24px 24px 60px;max-width:1600px;margin:0 auto;animation:fade .15s ease}
.play-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.play-head h1{font-size:24px;font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
.play-head h1 svg{width:28px;height:28px;color:var(--focus)}
.play-sub{color:var(--text-2);font-size:14px;margin:0 0 22px}
.play-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.play-card{background:var(--chip);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .12s ease,background .12s ease}
.play-card:hover{transform:translateY(-3px);background:var(--chip-hover)}
.play-thumb{aspect-ratio:16/10;display:grid;place-items:center;font-size:62px;line-height:1;position:relative;overflow:hidden}
.play-thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.28),transparent 62%)}
.play-badge{position:absolute;top:10px;left:10px;z-index:1;background:rgba(0,0,0,.45);color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:12px}
.play-play{position:absolute;right:12px;bottom:12px;z-index:1;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}
.play-card-body{padding:12px 14px 14px}
.play-card-title{font-size:15px;font-weight:600;margin:0 0 4px}
.play-card-desc{font-size:12px;line-height:17px;color:var(--text-2);margin:0}
.play-card-meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--text-2)}
.play-best{color:var(--focus);font-weight:600}
/* official catalog */
.play-section{margin-top:30px}
.play-section-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.play-section-head h2{font-size:19px;font-weight:600;margin:0}
.play-section-head span{font-size:12px;color:var(--text-2)}
.off-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.off-search{height:36px;min-width:200px;flex:1;max-width:320px;border:1px solid var(--border);background:var(--chip);border-radius:18px;padding:0 14px;color:var(--text);font-size:13px;outline:none}
.off-search:focus{border-color:var(--focus)}
.off-chip{height:32px;padding:0 12px;border-radius:16px;background:var(--chip);font-size:12px;font-weight:500;white-space:nowrap}
.off-chip:hover{background:var(--chip-hover)}
.off-chip.active{background:var(--text);color:var(--bg)}
.play-thumb.img{display:block;aspect-ratio:16/9;background:var(--sk)}
.play-thumb.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.play-card.official .play-card-meta{margin-top:8px}
.play-note{font-size:12px;line-height:18px;color:var(--text-2);margin:16px 0 0}
.off-detail{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:26px;align-items:start}
.off-detail-img{width:100%;border-radius:16px;background:var(--sk);aspect-ratio:16/9;object-fit:cover;display:block}
.off-detail h2{font-size:26px;line-height:32px;margin:0 0 8px}
.off-detail .off-meta{font-size:13px;color:var(--text-2);margin-bottom:14px}
.off-detail p{font-size:14px;line-height:22px;color:var(--text-2);max-width:720px}
.off-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.off-actions .game-btn{display:inline-grid;place-items:center;text-decoration:none;height:42px}
/* game player */
.game-view{max-width:1080px;margin:0 auto;padding:18px 24px 60px}
.game-top{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.game-top h1{font-size:22px;font-weight:700;margin:0;flex:1;min-width:160px}
.game-layout{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.game-area{background:#141414;border:1px solid var(--border);border-radius:16px;padding:16px;display:grid;place-items:center;min-height:420px;flex:1;min-width:320px;position:relative}
.game-side{width:250px;display:flex;flex-direction:column;gap:14px}
.game-stat{background:var(--chip);border-radius:12px;padding:14px 16px}
.game-stat b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);margin-bottom:4px}
.game-stat span{font-size:28px;font-weight:700;line-height:1}
.game-help{font-size:13px;line-height:20px;color:var(--text-2)}
.game-btn{height:40px;padding:0 18px;border-radius:20px;background:var(--text);color:var(--bg);font-size:13px;font-weight:600}
.game-btn:hover{opacity:.88}
.game-btn.alt{background:var(--chip);color:var(--text)}
.game-over{position:absolute;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;text-align:center;z-index:3;border-radius:16px}
.game-over b{display:block;color:#fff;font-size:26px;margin-bottom:6px}
.game-over p{color:#ddd;font-size:14px;margin:0 0 18px}
.game-over .game-btn{background:#fff;color:#111}
.game-wrap{position:relative;line-height:0}
.game-wrap canvas{border-radius:8px;max-width:100%;touch-action:none}
/* game: 2048 */
.g2048-top{display:flex;align-items:center;gap:14px;margin-bottom:12px;width:290px}
.g2048-top div{flex:1;background:#bbada0;color:#fff;border-radius:6px;padding:7px 12px;text-align:center}
.g2048-top b{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.g2048-top span{font-size:20px;font-weight:700}
.g2048-grid{display:grid;grid-template-columns:repeat(4,64px);gap:8px;background:#bbada0;padding:8px;border-radius:10px;touch-action:none}
.g2048 .t{width:64px;height:64px;border-radius:6px;background:#cdc1b4;display:grid;place-items:center;font-weight:800;font-size:22px;color:#776e65}
.t2{background:#eee4da!important}.t4{background:#ede0c8!important}.t8{background:#f2b179!important;color:#fff!important}.t16{background:#f59563!important;color:#fff!important}
.t32{background:#f67c5f!important;color:#fff!important}.t64{background:#f65e3b!important;color:#fff!important}.t128{background:#edcf72!important;color:#fff!important;font-size:18px!important}
.t256{background:#edcc61!important;color:#fff!important;font-size:18px!important}.t512{background:#edc850!important;color:#fff!important;font-size:18px!important}
.t1024{background:#edc53f!important;color:#fff!important;font-size:16px!important}.t2048{background:#edc22e!important;color:#fff!important;font-size:16px!important}
.t4096{background:#3c3a32!important;color:#fff!important;font-size:16px!important}
/* game: memory */
.mem-grid{display:grid;grid-template-columns:repeat(4,68px);gap:8px}
.mem-card{width:68px;height:68px;border-radius:8px;background:#3a3a3a;display:grid;place-items:center;font-size:30px;cursor:pointer;user-select:none;transition:transform .12s,background .12s}
.mem-card.flip{background:#f1f1f1;transform:rotateY(180deg)}
.mem-card.matched{background:#2e7d32;opacity:.7}
.mem-card span{display:none}
.mem-card.flip span,.mem-card.matched span{display:block}
.mem-card.flip{transform:none}
/* game: whack-a-mole */
.mole-grid{display:grid;grid-template-columns:repeat(3,86px);gap:12px}
.hole{width:86px;height:86px;border-radius:50%;background:#3b2a20;position:relative;overflow:hidden;box-shadow:inset 0 8px 14px rgba(0,0,0,.55)}
.mole{position:absolute;left:50%;bottom:-70px;transform:translateX(-50%);width:64px;height:64px;border-radius:50% 50% 42% 42%;background:#c98a52;display:grid;place-items:center;font-size:30px;cursor:pointer;transition:bottom .12s;user-select:none}
.mole.up{bottom:8px}
.mole.hit{background:#e8b36b;transform:translateX(-50%) scale(.9)}
/*=========================== responsive ===========================*/
@media (max-width:1200px){.watch-side{width:344px;flex-basis:344px}.compact .thumb{width:150px}}
@media (max-width:1000px){
.watch{flex-direction:column;padding:16px 16px 40px}
.watch-side{width:100%;flex:1 1 auto}
.compact .thumb{width:168px}
}

body[data-nav=full] .sidebar{display:block}

.mh-right{gap:4px}

 .short-item{padding:0;gap:0;display:block;position:relative}
 .short-stage{height:100%;width:100%;max-width:none;aspect-ratio:auto;border-radius:0;box-shadow:none}
 .short-info{position:absolute;left:12px;bottom:14px;width:calc(100% - 88px);max-width:none;padding:0;gap:10px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
 .short-info .short-channel-name,.short-info .short-title{color:#fff}
 .short-sub-btn{background:#fff;color:#0f0f0f}

 .short-nav{display:none}
 .short-title{font-size:13px;line-height:18px}
 .channel-banner{height:120px}
 .channel-head{flex-wrap:wrap;gap:12px;padding:0 16px 16px}
 .channel-head .avatar{width:72px;height:72px;font-size:30px;margin-top:-36px}
 .channel-name-lg{font-size:22px;line-height:28px}
 .channel-tabs{padding:0 16px;gap:18px}
 .playables{padding:16px 12px 40px}
 .play-head h1{font-size:20px}
 .play-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
 .play-thumb{font-size:44px}
 .play-card-title{font-size:13px}
 .game-view{padding:14px 12px 40px}
 .game-layout{flex-direction:column}
 .game-side{width:100%;flex-direction:row;flex-wrap:wrap}
 .game-side>*{flex:1;min-width:110px}
 .game-area{min-width:0;padding:10px}
 .mole-grid{grid-template-columns:repeat(3,72px);gap:8px}
 .hole{width:72px;height:72px}
 .mole{width:54px;height:54px}
 .mem-grid{grid-template-columns:repeat(4,58px);gap:6px}
 .mem-card{width:58px;height:58px;font-size:25px}
 .off-detail{grid-template-columns:1fr}
 .off-detail h2{font-size:21px;line-height:27px}
 .off-search{max-width:none;min-width:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  const out=a.slice();
  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=out[i];out[i]=out[j];out[j]=t;}

function txt(v){
  if(!v) return '';
  if(typeof v==='string') return v;
  if(typeof v.simpleText==='string') return v.simpleText;
  if(Array.isArray(v.runs)) return v.runs.map(r=>r.text||'').join('');
  if(typeof v.text==='string') return v.text;
  if(typeof v.content==='string') return v.content;
  return '';
}
function pickThumb(t){
  if(!t) return '';
  let a=Array.isArray(t)?t:Object.values(t);
  a=a.filter(x=>x&&x.url);
  if(!a.length) return '';
  a.sort((x,y)=>(x.width||0)-(y.width||0));
  const ok=a.filter(x=>(x.width||9999)<=640);
  const use=ok.length?ok:a;
  return use[use.length-1].url;
}
function parseCount(s){
  const m=String(s==null?'':s).replace(/,/g,'').match(/([\d.]+)\s*([KMB])?/i);
  if(!m) return 0;
  let n=parseFloat(m[1])||0;const u=(m[2]||'').toUpperCase();
  if(u==='K')n*=1e3;else if(u==='M')n*=1e6;else if(u==='B')n*=1e9;
  return Math.round(n);
}
function parseLen(s){const p=String(s||'').split(':').map(Number);return p.some(isNaN)?0:p.reduce((a,b)=>a*60+b,0);}
function relFrom(iso){
  if(!iso) return '';
  const d=(Date.now()-new Date(iso).getTime())/1000;
  if(!isFinite(d)||d<0) return '';
  const u=[[31536000,'year'],[2592000,'month'],[604800,'week'],[86400,'day'],[3600,'hour'],[60,'minute']];
  for(const p of u){if(d>=p[0]){const v=Math.floor(d/p[0]);return v+' '+p[1]+(v>1?'s':'')+' ago';}}
  return 'just now';
}
function normalize(raw){
  if(!raw) return null;
  const v=raw.video||raw.videoRenderer||raw.videoWithContextRenderer||raw;
  const sn=v.snippet||raw.snippet||{};
  const vid=v.videoId||raw.videoId||(v.id&&v.id.videoId)||(typeof v.id==='string'?v.id:'')||(sn.resourceId&&sn.resourceId.videoId)||'';
  if(!vid||typeof vid!=='string') return null;
  const ch=v.channel||sn.channel||{};
  const channelName=txt(ch.title)||txt(v.author)||txt(v.channelTitle)||txt(sn.channelTitle)||txt(v.ownerText)||txt(sn.videoOwnerChannelTitle)||'YouTube';
  let views=Number(v.stats&&v.stats.views);
  if(!isFinite(views)) views=Number(v.viewCount!=null?v.viewCount:sn.viewCount);
  if(!isFinite(views)) views=parseCount(txt(v.viewCountText)||txt(sn.viewCountText)||txt(v.viewCountText));
  const len=Number(v.lengthSeconds)||parseLen(txt(v.lengthText)||txt(sn.lengthText));
  const published=txt(v.publishedText)||txt(v.publishedTimeText)||txt(sn.publishedTime)||relFrom(sn.publishedAt);
  const badges=(Array.isArray(v.badges)?v.badges:[]).map(b=>txt(b)||txt(b&&b.metadataBadgeRenderer&&b.metadataBadgeRenderer.label)).filter(Boolean).slice(0,2);
  if(v.hasCaptions&&badges.indexOf('CC')<0) badges.push('CC');
  const out={
    id:vid,
    title:txt(v.title)||txt(sn.title)||'Untitled video',
    thumb:pickThumb(v.videoThumbnails||v.thumbnails||sn.thumbnails)||('https://i.ytimg.com/vi/'+vid+'/hqdefault.jpg'),
    channelName:channelName,
    channelId:v.authorId||v.channelId||(ch&&ch.id)||(sn.channelId)||'',
    channelAvatar:pickThumb(ch.thumbnails||v.authorThumbnails||[]),
    views:isFinite(views)?views:0,
    lengthSeconds:len||0,
    publishedTimeText:published||'',
    badges:badges.slice(0,2),
    live:!!(v.liveNow||v.isLiveNow||v.live||(v.stats&&v.stats.isLive))
  };
  if(!out.channelAvatar&&CHANNELS[out.channelId]) out.channelAvatar=CHANNELS[out.channelId].avatar||'';
  if(out.channelId){
    const c=CHANNELS[out.channelId]||(CHANNELS[out.channelId]={});
    c.name=out.channelName;
    if(out.channelAvatar) c.avatar=out.channelAvatar;
  }
  VIDEOS[vid]=out;
  return out;
}
function extract(data){
  if(!data) return [];
  let a=Array.isArray(data)?data:(data.contents||data.items||data.videos||data.results||(data.data&&(data.data.contents||data.data.items))||[]);
  if(a&&!Array.isArray(a)&&Array.isArray(a.contents)) a=a.contents;
  if(!Array.isArray(a)) return [];
  return a.map(normalize).filter(Boolean);
}

function getJSON(url,ms,headers){
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),ms||9000);
  return fetch(url,{headers:headers||{},signal:ctl.signal})
    .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .finally(()=>clearTimeout(timer));
}
async function getJSONRetry(url,ms){
  try{return await getJSON(url,ms);}
  catch(e){return await getJSON(url,ms);}
}

async function apiSearch(q,cursor,append){
  /* On "load more", stay on the source that produced the first page so the
     continuation token/page number stays meaningful. Otherwise race all
     sources and use whichever answers first (RapidAPI key still gets tried). */
  const sources=(append&&S.source)?LIVE_SOURCES.filter(s=>s.id===S.source):LIVE_SOURCES;
  const jobs=sources.map(async src=>{
    const out=await src.run(q||'',cursor);
    if(!out.items||!out.items.length) throw new Error(src.id+' -> no video results');
    return {src:src,out:out};
  });
  let winner;
  try{winner=await Promise.any(jobs);}
  catch(e){throw new Error('All video sources unavailable');}
  S.source=winner.src.id;S.sourceLabel=winner.src.label;S.live=true;
  return winner.out;
}

  const dot=$('apiDot'),tx=$('apiText');
  if(!dot) return;
  dot.classList.toggle('off',!S.live);
  tx.textContent=S.live?('live · '+S.sourceLabel):'offline';
  tx.title=S.live?('Video data from '+S.sourceLabel):'Using the cached demo feed — live sources are unreachable';
}
async function loadFeed(q,append,silent){
  if(S.loading) return;
  if(!append){S.query=q;S.cursor=null;renderSkeletons();}
  S.loading=true;
  try{
    const out=await apiSearch(q||'',append?S.cursor:null,append);
    if(append){
      const seen=new Set(S.items.map(v=>v.id));
      const add=out.items.filter(v=>!seen.has(v.id));
      S.items=S.items.concat(add);
      grid.insertAdjacentHTML('beforeend',add.map(cardHTML).join(''));
    }else{
      S.items=out.items;
      grid.innerHTML=S.items.map(cardHTML).join('');
    }
    S.cursor=out.cursorNext;S.live=true;
  }catch(err){
    console.error('[YouTube clone]',err);
    if(!append){
      S.items=SEED.map(v=>Object.assign({},v));
      grid.innerHTML=S.items.map(cardHTML).join('');
      S.cursor=null;S.live=false;
      if(!silent){S.query='';renderChips();toast('Live API unavailable — showing the cached WWE demo feed');}
      else{S.source=null;S.sourceLabel='';}
    }else{S.cursor=null;}
  }finally{
    S.loading=false;setStatus();buildSubscriptions();renderChips();
  }
}

let CH_ID='',CH_NAME='';
function seedShorts(){
  const out=SHORT_SEED.map(r=>({
    id:r[0],title:r[1],channelName:r[2],channelId:r[3],channelAvatar:CHANNEL_AVATARS[r[3]]||'',
    thumb:'https://i.ytimg.com/vi/'+r[0]+'/hqdefault.jpg',views:0,lengthSeconds:60,
    publishedTimeText:'',badges:[],live:false
  }));
  out.forEach(v=>{VIDEOS[v.id]=v;});
  return shuffle(out);
}
async function fetchShorts(forceId){
  /* Pick a random set of channels every time so the FYP never settles into
     one language or one niche. A linked Short forces its own channel in. */
  const force=forceId&&VIDEOS[forceId]?VIDEOS[forceId].channelId:'';
  let ids=shuffle(SHORT_CHANNELS.filter(id=>id!==force));
  if(force) ids.unshift(force);
  ids=ids.slice(0,12);
  const jobs=ids.map(async id=>{
    const cached=CHANNELS[id]||{};
    const data=await getJSONRetry(INV_HOST+'/api/v1/channels/'+encodeURIComponent(id)+'/shorts',9000).catch(()=>({videos:[]}));
    return shuffle((data.videos||[]).map(normalize)
      .filter(v=>v&&(!v.lengthSeconds||v.lengthSeconds<=180))
      .map(v=>{
        v.channelId=v.channelId||id;
        if(!v.channelName||v.channelName==='YouTube') v.channelName=cached.name||'';
        if(!v.channelAvatar) v.channelAvatar=CHANNEL_AVATARS[id]||cached.avatar||'';
        if(v.channelAvatar&&!cached.avatar) cached.avatar=v.channelAvatar;
        return v;
      })).slice(0,6);
  });
  const lists=await Promise.all(jobs);
  const items=[],seen=new Set();
  shuffle(lists).forEach(list=>list.forEach(v=>{if(!seen.has(v.id)){seen.add(v.id);items.push(v);}}));
  return shuffle(items);
}

function shortsShell(){
  shortsView.innerHTML='<div class="shorts">'
  +'<div class="shorts-head"><h2>'+Svg('shorts',24)+' Shorts</h2><div class="spacer"></div>'
  +'<button class="shorts-refresh">'+Svg('refresh',18)+' Refresh</button>'
  +'<button class="shorts-back">'+Svg('back',18)+' Back</button></div>'
  +'<div class="shorts-scroll" id="shortsScroll"><div class="empty">Loading Shorts…</div></div>'
  +'<div class="short-nav"><button id="shortUp" aria-label="Previous short">'+Svg('up')+'</button>'
  +'<button id="shortDown" aria-label="Next short">'+Svg('down')+'</button></div></div>';
  const sc=$('shortsScroll');
  let ticking=false;
  sc.addEventListener('scroll',()=>{
    if(ticking) return;
    ticking=true;
    requestAnimationFrame(()=>{
      ticking=false;
      const i=Math.max(0,Math.min(S.shorts.length-1,Math.round(sc.scrollTop/sc.clientHeight)));
      if(i!==S.shortIndex){
        /* Stop the previous short when scrolling away, like the real app. */
        sc.querySelectorAll('.short-stage iframe').forEach(f=>{
          const stage=f.parentNode,src=f.src.match(/embed\/([^?]+)/);
          if(src){const id=decodeURIComponent(src[1]);const v=S.shorts.find(x=>x.id===id);
            stage.innerHTML='<img class="poster" src="'+esc(v?v.thumb:'')+'" alt="" onerror="this.onerror=null;this.src=\''+PH+'\'"><button class="short-play" aria-label="Play short">'+Svg('play',30)+'</button>';}
        });
        S.shortIndex=i;updateShortNav();
      }
    });
  },{passive:true});
}
function updateShortNav(){
  const u=$('shortUp'),d=$('shortDown');
  if(u) u.disabled=S.shortIndex<=0;
  if(d) d.disabled=S.shortIndex>=S.shorts.length-1;
}
function renderShortList(){
  const sc=$('shortsScroll');
  if(!sc) return;
  sc.innerHTML=S.shorts.map(shortHTML).join('')||'<div class="empty"><b>No Shorts available</b>Could not load Shorts from the live API.</div>';
  sc.scrollTop=S.shortIndex*sc.clientHeight;
  updateShortNav();
}
function scrollShort(delta){
  const sc=$('shortsScroll');
  if(!sc||!S.shorts.length) return;
  const next=Math.max(0,Math.min(S.shorts.length-1,S.shortIndex+delta));
  S.shortIndex=next;
  sc.scrollTo({top:next*sc.clientHeight,behavior:'smooth'});
  updateShortNav();
}
function playShort(id,stage){
  if(stage.querySelector('iframe')) return;
  stage.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(id)
    +'?autoplay=1&rel=0&playsinline=1" title="Short" allow="accelerometer; autoplay; clipboard-write; '
    +'encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
}
async function loadShorts(forceId){
  if(S.shortsLoading) return;
  S.shortsLoading=true;
  shortsShell();
  let items=[];
  try{items=await fetchShorts(forceId);}catch(e){console.warn('[YouTube clone] Shorts source failed',e);}
  /* The public API is flaky. If too few channels answered, mix in fresh
     offline picks from the other categories so the FYP stays varied. */
  if(items.length){
    const have=new Set(items.map(v=>v.channelId));
    if(have.size<6){
      const extra=seedShorts().filter(v=>!have.has(v.channelId)&&!items.some(x=>x.id===v.id));
      items=shuffle(items.concat(extra.slice(0,24)));
    }
  }else items=seedShorts();
  S.shorts=items;S.shortIndex=0;
  if(S.view==='shorts') renderShortList();
  S.shortsLoading=false;
}
function showShorts(id){
  S.view='shorts';
  cleanupGame();
  browseView.hidden=true;
  watchView.hidden=true;
  channelView.hidden=true;
  playablesView.hidden=true;
  shortsView.hidden=false;
  document.title='Shorts - YouTube';
  if(isMobile()) setNav('hidden');
  loadShorts(id).then(()=>{
    if(id&&S.view==='shorts'){
      const i=S.shorts.findIndex(v=>v.id===id);
      if(i>0){S.shortIndex=i;const sc=$('shortsScroll');if(sc)sc.scrollTop=i*sc.clientHeight;updateShortNav();}
    }
  });
}
shortsView.addEventListener('click',async e=>{
  if(e.target.closest('.shorts-back')){goHome();return;}
  if(e.target.closest('.shorts-refresh')){loadShorts();return;}
  if(e.target.closest('#shortUp')){scrollShort(-1);return;}
  if(e.target.closest('#shortDown')){scrollShort(1);return;}
  const sub=e.target.closest('.short-sub-btn');
  if(sub){
    e.stopPropagation();
    const on=sub.textContent.trim()==='Subscribe';
    sub.textContent=on?'Subscribed':'Subscribe';
    sub.classList.toggle('on',on);
    return;
  }
  const act=e.target.closest('.short-act');
  if(act){
    e.stopPropagation();
    const kind=act.dataset.act;
    if(kind==='like'||kind==='dislike'){const other=act.parentNode.querySelector('[data-act="'+(kind==='like'?'dislike':'like')+'"]');if(other)other.classList.remove('liked');act.classList.toggle('liked');}
    else if(kind==='share'){
      const item=act.closest('.short-item'),v=S.shorts[Number(item&&item.dataset.index)||0];
      const url=location.origin+location.pathname+'#shorts='+encodeURIComponent(v?v.id:'');
      try{await navigator.clipboard.writeText(url);toast('Short link copied to clipboard');}catch(err){toast(url);}
    }
    else if(kind==='comment') toast('Comments are not available in the Shorts player');
    else toast('More actions are not available in this recreation');
    return;
  }
  const stage=e.target.closest('.short-stage');
  if(stage){playShort(stage.dataset.short,stage);return;}
  const ch=e.target.closest('[data-cid],[data-cname]');
  if(ch){e.stopPropagation();openChannel(ch.dataset.cid,ch.dataset.cname);}
});

function renderChannel(id,name,info,videos){
  CH_ID=id;CH_NAME=name;
  const cached=CHANNELS[id]||{};
  const avatar=pickThumb((info&&info.authorThumbnails)||[])||cached.avatar||'';
  const subCount=(info&&info.subCount)||cached.subs||0;
  const subs=subCount?fmtShort(subCount)+' subscribers':subsFor(name);
  const desc=(info&&info.description)||'Welcome to '+name+' — videos, Shorts and more.';
  const color=colorFor(name);
  channelView.innerHTML=
   '<div class="channel-banner" style="background:linear-gradient(115deg,'+color+',#161616)"></div>'
  +'<div class="channel-head">'+avatarHTML(name,avatar,96)

  +'<div class="channel-handle">@'+esc(String(name).replace(/\s+/g,'').toLowerCase())+'</div>'
  +'<div class="channel-stats">'+esc(subs)+(info&&info.totalViews?' • '+fmtViews(info.totalViews):'')+'</div>'
  +'<div class="channel-desc">'+esc(desc)+'</div></div>'
  +'<div class="channel-actions"><button class="sub-btn" id="chSub">Subscribe</button>'
  +'<button class="pill-btn" id="chShorts">'+Svg('shorts',20)+' Shorts</button></div></div>'

  const g=$('chGrid');
  g.innerHTML=videos.map(cardHTML).join('')||'<div class="empty"><b>No videos yet</b>This channel has no uploaded videos available.</div>';
}
async function showChannel(key,name){
  S.view='channel';
  cleanupGame();
  browseView.hidden=true;watchView.hidden=true;shortsView.hidden=true;playablesView.hidden=true;channelView.hidden=false;
  document.title=(name||'Channel')+' - YouTube';
  if(isMobile()) setNav('hidden');
  channelSkeleton();
  try{
    let id=key||'',nm=name||'',info=null,videos=[];
    if(/^UC[\w-]{10,}$/.test(id)){
      const pair=await Promise.all([
        getJSONRetry(INV_HOST+'/api/v1/channels/'+encodeURIComponent(id),9000).catch(()=>null),
        getJSONRetry(INV_HOST+'/api/v1/channels/'+encodeURIComponent(id)+'/videos',9000).catch(()=>null)
      ]);
      info=pair[0];videos=extract(pair[1]||{});
      if(!videos.length){
        /* The public API sometimes drops a request. Try Shorts, then anything
           already cached for this channel, so the profile is never empty. */
        const sh=await getJSON(INV_HOST+'/api/v1/channels/'+encodeURIComponent(id)+'/shorts',9000).catch(()=>null);
        videos=extract(sh||{});
      }
      if(!videos.length) videos=Object.keys(VIDEOS).map(k=>VIDEOS[k]).filter(v=>v.channelId===id);
      nm=(info&&info.author)||nm||'Channel';
    }else{
      const q=id||nm||'channel';
      const data=await getJSONRetry(INV_HOST+'/api/v1/search?q='+encodeURIComponent(q)+'&type=video',9000).catch(()=>null);
      videos=extract(data||[]);
      const found=(Array.isArray(data)?data:[]).find(x=>x&&x.authorId)||(Array.isArray(data)?data:[])[0];
      if(found&&found.authorId){
        id=found.authorId;nm=found.author||nm||q;
        info=await getJSONRetry(INV_HOST+'/api/v1/channels/'+encodeURIComponent(id),9000).catch(()=>null);
        const more=await getJSONRetry(INV_HOST+'/api/v1/channels/'+encodeURIComponent(id)+'/videos',9000).catch(()=>null);
        if(more&&extract(more).length) videos=extract(more);
      }else{nm=nm||q;}
    }
    if(!info&&CHANNELS[id]){
      const c=CHANNELS[id];
      info={author:c.name||nm,authorThumbnails:c.avatar?[{url:c.avatar,width:176,height:176}]:[],
            subCount:c.subs||0,authorVerified:!!c.verified,description:c.desc||''};
    }
    renderChannel(id,nm,info,videos);
  }catch(err){
    console.error('[YouTube clone] Channel load failed',err);
    channelView.innerHTML='<div class="empty"><b>Channel unavailable</b>Could not load this profile right now.</div>';
  }
}
channelView.addEventListener('click',async e=>{
  if(e.target.closest('#chSub')){

    const g=$('chGrid');

      let list=extract(data||{});
      if(!list.length){
        const sh=await getJSON(INV_HOST+'/api/v1/channels/'+encodeURIComponent(CH_ID)+'/shorts',9000).catch(()=>null);
        list=extract(sh||{});

      if(!list.length) list=Object.keys(VIDEOS).map(k=>VIDEOS[k]).filter(v=>v.channelId===CH_ID);
      g.innerHTML=list.map(cardHTML).join('')||'<div class="empty">No videos available.</div>';
    }else{
      const data=await getJSONRetry(INV_HOST+'/api/v1/channels/'+encodeURIComponent(CH_ID)+'/shorts',9000).catch(()=>null);
      g.innerHTML=extract(data||{}).map(cardHTML).join('')||'<div class="empty">This channel has no Shorts.</div>';
    }
    return;
  }
  const ch=e.target.closest('[data-cid],[data-cname]');
  if(ch){e.stopPropagation();openChannel(ch.dataset.cid,ch.dataset.cname);}
});
function openChannel(id,name){
  const key=id||name||'';
  if(!key) return;
  const h='#channel='+encodeURIComponent(key);
  if(location.hash===h){showChannel(key,name);return;}
  history.pushState(null,'',h);
  showChannel(key,name);
}

function game2048(stage){
  let b=Array(16).fill(0),score=0,best=getBest('2048');
  stage.innerHTML='<div class="g2048"><div class="g2048-top"><div><b>Score</b><span id="gScore">0</span></div>'
   +'<div><b>Best</b><span id="gBest">'+best+'</span></div></div><div class="g2048-grid" id="gGrid"></div></div>';
  const grid=stage.querySelector('#gGrid');
  function draw(){
    grid.innerHTML=b.map(v=>'<div class="t t'+v+'">'+(v||'')+'</div>').join('');
    stage.querySelector('#gScore').textContent=score;
    setGameScore(score);
    if(score>best){best=score;setBest('2048',best);setGameBest(best);stage.querySelector('#gBest').textContent=best;}
  }
  function add(){
    const e=[];for(let i=0;i<16;i++)if(!b[i])e.push(i);
    if(!e.length)return;
    const i=e[Math.floor(Math.random()*e.length)];
    b[i]=Math.random()<.9?2:4;
  }
  function canMove(){
    if(b.some(v=>!v))return true;
    for(let r=0;r<4;r++)for(let c=0;c<3;c++){
      if(b[r*4+c]===b[r*4+c+1])return true;
      if(b[c*4+r]===b[(c+1)*4+r])return true;
    }
    return false;
  }
  function move(dir){
    const before=b.join(',');
    const groups=[];
    if(dir==='left'||dir==='right'){for(let r=0;r<4;r++)groups.push([0,1,2,3].map(c=>r*4+c));}
    else{for(let c=0;c<4;c++)groups.push([0,1,2,3].map(r=>r*4+c));}
    const rev=(dir==='right'||dir==='down');
    groups.forEach(gr=>{
      let vals=gr.map(i=>b[i]).filter(Boolean);
      if(rev)vals=vals.reverse();
      const out=[];
      for(let i=0;i<vals.length;i++){
        if(vals[i]===vals[i+1]){out.push(vals[i]*2);score+=vals[i]*2;i++;}
        else out.push(vals[i]);
      }
      while(out.length<4)out.push(0);
      if(rev)out.reverse();
      gr.forEach((idx,i)=>b[idx]=out[i]);
    });
    if(b.join(',')!==before){add();draw();if(!canMove())showGameOver('Score '+score);}
  }
  const key=e=>{
    const m={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
    if(m[e.key]){e.preventDefault();move(m[e.key]);}
  };
  let tx=0,ty=0;
  const ts=e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;};
  const te=e=>{
    const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  };
  document.addEventListener('keydown',key);
  grid.addEventListener('touchstart',ts,{passive:true});
  grid.addEventListener('touchend',te,{passive:true});
  GAME_CLEANUP=()=>{document.removeEventListener('keydown',key);};
  gameHelp('Use the arrow keys, WASD, or swipe on the board. Matching numbers merge — reach 2048!');
  add();add();draw();
}
function gameSnake(stage){
  const W=400,H=400,C=20,N=W/C;
  stage.innerHTML='<div class="game-wrap"><canvas id="gCanvas" width="'+W+'" height="'+H+'"></canvas></div>';
  const cv=stage.querySelector('#gCanvas'),ctx=cv.getContext('2d');
  let snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}],dir={x:1,y:0},next={x:1,y:0},food={x:15,y:10},score=0,timer=null,dead=false;
  function place(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
  function draw(){
    ctx.fillStyle='#181818';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(255,255,255,.045)';ctx.lineWidth=1;
    for(let i=1;i<N;i++){
      ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,H);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(W,i*C);ctx.stroke();
    }
    ctx.fillStyle='#e74c3c';
    ctx.beginPath();ctx.arc(food.x*C+C/2,food.y*C+C/2,C/2-2,0,Math.PI*2);ctx.fill();
    snake.forEach((s,i)=>{
      ctx.fillStyle=i===0?'#aed581':'#7cb342';
      if(ctx.roundRect){ctx.beginPath();ctx.roundRect(s.x*C+1,s.y*C+1,C-2,C-2,4);ctx.fill();}
      else ctx.fillRect(s.x*C+1,s.y*C+1,C-2,C-2);
    });
  }
  function step(){
    if(dead)return;
    dir=next;
    const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.slice(0,-1).some(s=>s.x===h.x&&s.y===h.y)){
      dead=true;clearInterval(timer);showGameOver('You scored '+score);return;
    }
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){
      score++;setGameScore(score);
      if(score>getBest('snake')){setBest('snake',score);setGameBest(score);}
      place();
    }else snake.pop();
    draw();
  }
  const key=e=>{
    const m={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},W:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},S:{x:0,y:1},
             ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},A:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0},D:{x:1,y:0}};
    if(m[e.key]){e.preventDefault();const d=m[e.key];if(d.x!==-dir.x||d.y!==-dir.y)next=d;}
  };
  document.addEventListener('keydown',key);
  timer=setInterval(step,130);
  gameHelp('Use the arrow keys or WASD to steer. Eat the red food to grow — don\'t hit the walls or your own tail.');
  draw();
  GAME_CLEANUP=()=>{clearInterval(timer);document.removeEventListener('keydown',key);};
}
function gameMemory(stage){
  const syms=['🍎','🍌','🍇','🍓','🍒','🥝','🍍','🥑'];
  const deck=syms.concat(syms).sort(()=>Math.random()-.5);
  let open=[],matched=0,moves=0,lock=false;
  stage.innerHTML='<div class="mem-grid" id="memGrid">'+deck.map((s,i)=>'<div class="mem-card" data-i="'+i+'"><span>'+s+'</span></div>').join('')+'</div>';
  stage.querySelector('#memGrid').addEventListener('click',e=>{
    const c=e.target.closest('.mem-card');
    if(!c||lock||c.classList.contains('flip')||c.classList.contains('matched'))return;
    c.classList.add('flip');open.push(c);
    if(open.length===2){
      moves++;setGameScore(moves);lock=true;
      const a=open[0],b=open[1];
      if(a.querySelector('span').textContent===b.querySelector('span').textContent){
        setTimeout(()=>{
          a.classList.add('matched');b.classList.add('matched');open=[];lock=false;matched++;
          if(matched===8){setBest('memory',moves);setGameBest(moves);showGameOver('Completed in '+moves+' flips!');}
        },420);
      }else{
        setTimeout(()=>{a.classList.remove('flip');b.classList.remove('flip');open=[];lock=false;},700);
      }
    }
  });
  gameHelp('Flip two cards at a time and remember what you see. Fewer flips is better — try to beat your best score!');
  GAME_CLEANUP=()=>{};
}
function gameMole(stage){
  stage.innerHTML='<div class="mole-grid" id="moleGrid">'+Array(9).fill(0).map(()=>'<div class="hole"><div class="mole">🐹</div></div>').join('')+'</div>';
  const holes=[].map.call(stage.querySelectorAll('.mole'),m=>m);
  let score=0,time=30,idx=-1,pop=null,tick=null;
  function up(){
    holes.forEach(m=>m.classList.remove('up','hit'));
    idx=Math.floor(Math.random()*9);
    holes[idx].classList.add('up');
    pop=setTimeout(up,800);
  }
  stage.querySelector('#moleGrid').addEventListener('click',e=>{
    const m=e.target.closest('.mole');
    if(!m||!m.classList.contains('up'))return;
    m.classList.add('hit');score++;setGameScore(score);
    if(score>getBest('mole')){setBest('mole',score);setGameBest(score);}
    clearTimeout(pop);
    setTimeout(()=>{m.classList.remove('up','hit');up();},180);
  });
  tick=setInterval(()=>{
    time--;
    if(time<=0){
      clearInterval(tick);clearTimeout(pop);
      holes.forEach(m=>m.classList.remove('up','hit'));
      showGameOver('You whacked '+score+' moles!');
    }
  },1000);
  gameHelp('Tap the hamster whenever it pops up. You have 30 seconds — how many can you whack?');
  up();
  GAME_CLEANUP=()=>{clearInterval(tick);clearTimeout(pop);};
}
function gameBreaker(stage){
  const W=360,H=400;
  stage.innerHTML='<div class="game-wrap"><canvas id="gCanvas" width="'+W+'" height="'+H+'"></canvas></div>';
  const cv=stage.querySelector('#gCanvas'),ctx=cv.getContext('2d');
  const pw=72,ph=10,cols=8,rows=5,bw=38,bh=16,gap=5;
  let px=(W-pw)/2,ball={x:W/2,y:H-45,r:6,dx:2.6,dy:-2.8},bricks=[],score=0,lives=3,raf=null,over=false;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:12+c*(bw+gap),y:36+r*(bh+gap),on:true,color:'hsl('+(r*54)+' 80% 55%)'});
  function draw(){
    ctx.fillStyle='#181818';ctx.fillRect(0,0,W,H);
    bricks.forEach(b=>{if(b.on){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,bw,bh);}});
    ctx.fillStyle='#e0e0e0';ctx.fillRect(px,H-18,pw,ph);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#bbb';ctx.font='12px sans-serif';ctx.fillText('Lives: '+lives,12,20);
  }
  function loop(){
    if(over)return;
    ball.x+=ball.dx;ball.y+=ball.dy;
    if(ball.x<ball.r||ball.x>W-ball.r)ball.dx*=-1;
    if(ball.y<ball.r)ball.dy*=-1;
    if(ball.y>H){
      lives--;
      if(lives<=0){over=true;showGameOver('Final score '+score);draw();return;}
      ball={x:W/2,y:H-45,r:6,dx:2.6,dy:-2.8};px=(W-pw)/2;
    }
    if(ball.y+ball.r>=H-18&&ball.y<H-8&&ball.x>=px&&ball.x<=px+pw&&ball.dy>0){
      ball.dy*=-1;
      ball.dx=(ball.x-(px+pw/2))/(pw/2)*3;
    }
    bricks.forEach(b=>{
      if(!b.on)return;
      if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+bw&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+bh){
        b.on=false;ball.dy*=-1;score++;setGameScore(score);
        if(score>getBest('breaker')){setBest('breaker',score);setGameBest(score);}
        if(bricks.every(x=>!x.on)){over=true;showGameOver('You cleared the wall!');}
      }
    });
    draw();
    if(!over)raf=requestAnimationFrame(loop);
  }
  const move=e=>{
    const r=cv.getBoundingClientRect();
    px=Math.max(0,Math.min(W-pw,(e.clientX-r.left)*(W/r.width)-pw/2));
  };
  const key=e=>{
    if(e.key==='ArrowLeft'){e.preventDefault();px=Math.max(0,px-24);}
    if(e.key==='ArrowRight'){e.preventDefault();px=Math.min(W-pw,px+24);}
  };
  cv.addEventListener('mousemove',move);
  cv.addEventListener('touchmove',e=>{e.preventDefault();move(e.touches[0]);},{passive:false});
  document.addEventListener('keydown',key);
  gameHelp('Move your mouse or use the arrow keys to slide the paddle. Keep the ball alive and break every brick!');
  loop();
  GAME_CLEANUP=()=>{if(raf)cancelAnimationFrame(raf);document.removeEventListener('keydown',key);};
}

  loadFeed(q);
  renderChips();
}
/*=========================== theme / menu ===========================*/
function setTheme(t){
  document.body.dataset.theme=t;
  try{localStorage.setItem('yt-theme',t);}catch(e){}
  const item=$('themeItem');
  if(item) item.textContent='Appearance: '+(t==='dark'?'Dark':'Light');
}
const menu=$('accountMenu');
function closeMenu(){menu.hidden=true;}
/*=========================== events ===========================*/
$('menuBtn').addEventListener('click',()=>{
  if(isMobile()) setNav(document.body.dataset.nav==='full'?'hidden':'full');
  else{S.navPinned=true;setNav(document.body.dataset.nav==='full'?'mini':'full');}
});
$('scrim').addEventListener('click',()=>setNav('hidden'));
$('logoLink').addEventListener('click',e=>{e.preventDefault();goHome();});
$('searchForm').addEventListener('submit',e=>{
  e.preventDefault();
  const q=$('searchInput').value.trim();
  if(!q){$('searchInput').focus();return;}
  if(location.hash) goHome();
  loadFeed(q);
  renderChips();
});
$('micBtn').addEventListener('click',()=>toast('Voice search is not available in this recreation'));
$('createBtn').addEventListener('click',()=>toast('Upload is not available in this recreation'));
$('bellBtn').addEventListener('click',()=>toast('You have no new notifications'));
$('avatarBtn').addEventListener('click',e=>{e.stopPropagation();menu.hidden=!menu.hidden;});
document.addEventListener('click',e=>{
  if(menu.hidden) return;
  if(e.target.closest('#accountMenu')||e.target.closest('#avatarBtn')) return;
  closeMenu();
});
menu.addEventListener('click',e=>{
  const b=e.target.closest('.menu-item');
  if(!b||!b.dataset.act) return;
  const a=b.dataset.act;
  if(a==='theme') setTheme(document.body.dataset.theme==='dark'?'light':'dark');
  else if(a==='shortcuts') toast('Shortcuts: “/” search — “Esc” close — “←” back');
  else if(a==='signout') toast('Signed out (demo only)');
  else toast('“'+b.textContent.trim()+'” is not available in this recreation');
  if(a!=='theme') closeMenu();
});
chipsEl.addEventListener('click',e=>{
  const c=e.target.closest('.chip');
  if(!c) return;
  const q=c.dataset.chip==='All'?'':c.dataset.chip.toLowerCase();
  if(q===S.query&&!S.loading) return;
  if(location.hash) goHome();
  loadFeed(q);
  renderChips();
});
sidebar.addEventListener('click',e=>{
  const b=e.target.closest('[data-nav],[data-channel]');
  if(!b) return;
  if(isMobile()) setNav('hidden');
  if(b.dataset.channel){openChannel(b.dataset.cid,b.dataset.channel);return;}
  const k=b.dataset.nav;
  if(k==='home'){goHome();return;}
  if(k==='shorts'){openShorts();return;}
  if(k==='playables'){openPlayables();return;}
  const q={subs:'wwe',trending:'trending',music:'music',gaming:'gaming',news:'news',sport:'sports'}[k];
  if(q){searchFor(q);return;}
  toast('“'+b.textContent.trim()+'” is not available in this recreation');
});
document.addEventListener('click',e=>{
  if(e.target.closest('[data-cid],[data-cname]')) return;
  const el=e.target.closest('.card[data-id],.compact[data-id]');
  if(!el) return;
  openVideo(el.dataset.id);
});
document.addEventListener('keydown',e=>{
  const a=document.activeElement;
  if(e.key==='Escape'){
    if(menu.hidden===false){closeMenu();return;}
    if(S.view==='game'||S.view==='official'){e.preventDefault();openPlayables();return;}
    if(S.view==='playables'){e.preventDefault();goHome();return;}
    if(isMobile()&&document.body.dataset.nav==='full') setNav('hidden');
  }
  if(e.key==='/'&&a&&a.tagName!=='INPUT'&&a.tagName!=='TEXTAREA'){
    e.preventDefault();$('searchInput').focus();$('searchInput').select();
  }
  if(S.view==='shorts'&&a&&a.tagName!=='INPUT'){
    if(e.key==='ArrowDown'){e.preventDefault();scrollShort(1);return;}
    if(e.key==='ArrowUp'){e.preventDefault();scrollShort(-1);return;}
    if(e.key==='Escape'){goHome();return;}
  }
  if(e.key==='Enter'&&a&&a.dataset&&a.dataset.id) openVideo(a.dataset.id);
});
window.addEventListener('scroll',()=>{
  if(browseView.hidden||S.loading||!S.cursor) return;
  if(window.innerHeight+window.scrollY>=document.body.offsetHeight-1200) loadFeed(S.query,true);
},{passive:true});
let rz;
window.addEventListener('resize',()=>{
  clearTimeout(rz);
  rz=setTimeout(()=>{
    if(!S.navPinned) setNav(defaultNav());
    else document.body.classList.toggle('drawer',document.body.dataset.nav==='full'&&isMobile());
  },120);
});
window.addEventListener('popstate',route);
window.addEventListener('hashchange',route);
/*=========================== init ===========================*/
(function init(){
  let theme='dark';
  try{theme=localStorage.getItem('yt-theme')||'dark';}catch(e){}
  setTheme(theme);
  setNav(defaultNav());
  renderSidebar();
  renderChips();
  renderSkeletons();
  setStatus();
  S.items=SEED.map(v=>Object.assign({},v));
  buildSubscriptions();
  route();
  loadFeed('',false,true).then(()=>{if(/^#watch=/.test(location.hash)) route();});
})();
})();
</script>
</body>
</html>
